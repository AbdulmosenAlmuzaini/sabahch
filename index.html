<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأحماض والقواعد | تعليم مبرمج بالذكاء الاصطناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#17222C; --muted:#536677; --line:#D4DDE4; --soft:#E8EEF2;
  --l1:#C42A3E; --l2:#C9650A; --l3:#23864D; --l4:#4943A6;
  --ok:#1F7A45; --bad:#C42A3E; --okbg:#E2F2E8; --badbg:#FBE6E9; --aibg:#EEEDFA;
  --acc:var(--l1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171D; --surface:#18222B; --ink:#E5ECF1; --muted:#9AAEBE; --line:#2B3946; --soft:#202D38;
    --l1:#F16074; --l2:#F2994A; --l3:#4CC27F; --l4:#9590EE;
    --ok:#4CC27F; --bad:#F16074; --okbg:#15301F; --badbg:#3A1B21; --aibg:#24223F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171D; --surface:#18222B; --ink:#E5ECF1; --muted:#9AAEBE; --line:#2B3946; --soft:#202D38;
  --l1:#F16074; --l2:#F2994A; --l3:#4CC27F; --l4:#9590EE;
  --ok:#4CC27F; --bad:#F16074; --okbg:#15301F; --badbg:#3A1B21; --aibg:#24223F;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:700;line-height:1.45;margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
bdi.f{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;white-space:nowrap}
sub,sup{font-size:.6em;line-height:0}
sup{vertical-align:.75em}
sub{vertical-align:-.3em}
sub.st{font-size:.5em;vertical-align:-.45em;margin-inline-start:1px}
.eq{direction:ltr;text-align:center;font-size:1.08em;padding:.55rem .8rem;margin:.6rem 0;background:var(--soft);border-radius:8px;overflow-x:auto;white-space:nowrap}
img,svg{max-width:100%}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:1rem}
.brand{font-family:"Cairo",Tahoma,sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;white-space:nowrap}
.mini-strip{flex:1;display:flex;height:10px;border-radius:5px;overflow:hidden;max-width:420px;margin-inline-start:auto}
.mini-strip i{flex:1}
.top-count{font-size:.85rem;color:var(--muted);white-space:nowrap}

.wrap{max-width:1180px;margin:0 auto;padding:1.5rem 1rem 3rem}

/* home */
.hero{padding:2.2rem 0 1.6rem}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:700;letter-spacing:0}
.hero p.lead{max-width:62ch;color:var(--muted);font-size:1.08rem;margin:.6rem 0 1.4rem}
.strip-big{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;direction:ltr;max-width:760px}
.strip-big i{height:44px;border-radius:4px;transition:opacity .5s,transform .5s;position:relative}
.strip-big i.off{opacity:.18}
.strip-nums{display:grid;grid-template-columns:repeat(15,1fr);direction:ltr;max-width:760px;font-size:.78rem;color:var(--muted);text-align:center;margin-top:3px}
.strip-cap{margin-top:.6rem;font-weight:600}
.name-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:1.6rem 0 .4rem}
.name-row input{font:inherit;padding:.5rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:220px}
.how{max-width:70ch;color:var(--muted);margin:1.6rem 0 2rem;font-size:.98rem}
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:4.2rem 1fr auto;gap:1rem;align-items:center;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.lnum{font-family:"Cairo",Tahoma,sans-serif;font-size:2.6rem;font-weight:700;color:var(--lc);line-height:1;text-align:center}
.lrow h2{font-size:1.3rem}
.lmeta{font-size:.9rem;color:var(--muted)}
.lbar{height:6px;background:var(--soft);border-radius:3px;margin-top:.45rem;max-width:360px;overflow:hidden}
.lbar b{display:block;height:100%;background:var(--lc);border-radius:3px}
.frames-peek{font-size:.86rem;color:var(--muted);margin-top:.3rem}

.btn{display:inline-flex;align-items:center;gap:.4rem;border:0;border-radius:8px;padding:.55rem 1.1rem;background:var(--acc);color:#fff;font-weight:600;text-decoration:none}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:color-mix(in srgb,var(--acc) 14%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--acc) 45%,var(--surface))}
.btn.ghost:hover{background:color-mix(in srgb,var(--acc) 24%,var(--surface))}
.btn.small{padding:.35rem .8rem;font-size:.92rem}
.btn.ai{background:var(--l4)}
.locked{font-size:.9rem;color:var(--muted)}

/* lesson layout */
.lesson{display:grid;grid-template-columns:260px 1fr;gap:2rem;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.side h2{font-size:1.05rem;color:var(--acc);margin-bottom:.6rem}
.side ol{list-style:none;margin:0;padding:0;border-inline-start:2px solid var(--line)}
.side li a,.side li span{display:flex;gap:.55rem;align-items:flex-start;padding:.45rem .7rem;text-decoration:none;font-size:.93rem;line-height:1.5;margin-inline-start:-2px;border-inline-start:2px solid transparent}
.side li a:hover{background:var(--soft)}
.side li .dot{flex:none;width:1.45rem;height:1.45rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:700;margin-top:.05rem}
.side li.done .dot{background:var(--acc);border-color:var(--acc);color:#fff}
.side li.cur a{border-inline-start-color:var(--acc);font-weight:600;background:var(--soft)}
.side li.lock span{color:var(--muted);opacity:.6;cursor:not-allowed}
.side .back{display:inline-block;margin-bottom:1rem;font-size:.9rem;color:var(--muted)}
.side .endlink{margin-top:.8rem}

.frame{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.6rem clamp(1rem,3vw,2.2rem);min-width:0}
.crumb{font-size:.88rem;color:var(--acc);font-weight:600;margin:0 0 .2rem}
.frame h2{font-size:clamp(1.5rem,3.4vw,2rem);margin-bottom:1rem}
.frame h3{font-size:1.08rem;margin:0 0 .7rem}
.sci{max-width:72ch}
.sci p{margin:.5rem 0}
.sci ul{margin:.4rem 0;padding-inline-start:1.3rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.8rem 0}
.duo>div{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;border-top:4px solid var(--c)}
.duo h4{margin:0 0 .3rem;font-size:1rem}
.duo ul{margin:0;padding-inline-start:1.1rem;font-size:.96rem}
.note{border-inline-start:4px solid var(--l2);background:var(--soft);padding:.5rem .9rem;border-radius:0 8px 8px 0;font-size:.95rem;margin:.8rem 0}
.sim{margin:1.6rem 0;padding:1.2rem;border-radius:12px;background:var(--soft)}
.sim .hint{margin:0 0 .7rem;color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0 .8rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .85rem;font-size:.93rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.out{min-height:1.6em;margin:.7rem 0 0;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.6rem}
.canva{display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px dashed var(--acc);border-radius:10px;padding:.8rem 1rem;text-decoration:none;margin:1.2rem 0}
.canva b{color:var(--acc)}
.canva small{color:var(--muted);display:block;font-size:.85rem}

/* questions */
.qs{margin-top:1.8rem;border-top:1px solid var(--line);padding-top:1.3rem}
.q{margin-bottom:1.3rem}
.q .qt{font-weight:600;margin:0 0 .6rem}
.opts{display:grid;gap:.45rem}
.opt{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.6rem .9rem;line-height:1.6;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:.6rem;padding:.65rem .9rem;border-radius:9px;font-size:.96rem}
.fb.good{background:var(--okbg);border-inline-start:4px solid var(--ok)}
.fb.bad{background:var(--badbg);border-inline-start:4px solid var(--bad)}
.qdone{font-size:.93rem;color:var(--muted);margin-bottom:.4rem}
.qdone b{color:var(--ok)}
.ai-box{margin-top:.6rem;background:var(--aibg);border-radius:9px;padding:.7rem .95rem;font-size:.96rem;white-space:normal}
.ai-box .who{font-weight:700;color:var(--l4);font-size:.85rem;display:block;margin-bottom:.15rem}
.ai-only{display:none!important}
body.ai-on .ai-only{display:revert!important}
body.ai-on .ai-off{display:none!important}
.ai-off{font-size:.88rem;color:var(--muted)}

.tutor{margin-top:1.8rem;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tutor summary{cursor:pointer;padding:.8rem 1rem;font-weight:600;background:var(--aibg);list-style:none}
.tutor summary::-webkit-details-marker{display:none}
.tutor .tbody{padding:1rem}
.chat{display:flex;flex-direction:column;gap:.5rem;max-height:360px;overflow-y:auto;margin-bottom:.7rem}
.msg{padding:.55rem .85rem;border-radius:10px;max-width:88%;font-size:.95rem}
.msg.me{background:var(--soft);align-self:flex-start}
.msg.bot{background:var(--aibg);align-self:flex-end}
.ask{display:flex;gap:.5rem}
.ask input{flex:1;font:inherit;padding:.5rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.suggest{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}

.fnav{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap;align-items:center}
.gate{font-size:.9rem;color:var(--muted)}

/* sims */
.litmus-stage{display:flex;gap:2.5rem;justify-content:center;margin:.6rem 0}
.paper{text-align:center;font-size:.88rem}
.strip{width:42px;height:150px;border-radius:4px;margin:0 auto .3rem;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.strip i{position:absolute;inset:auto 0 0;height:50%;transition:background-color 1.2s ease}
.beaker{display:block;margin:0 auto;width:180px;height:190px}
.bub{opacity:0}
.beaker.on .bub{animation:rise 1.8s infinite ease-in}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-95px);opacity:0}}
.bars{display:flex;gap:2rem;justify-content:center;align-items:flex-end;height:180px;margin:.6rem 0;direction:ltr}
.bar{width:70px;text-align:center;font-size:.85rem;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar b{display:block;border-radius:6px 6px 0 0;transition:height .4s}
input[type=range]{width:100%;accent-color:var(--acc)}
.rangelbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.sp{border:2px dashed var(--line);background:var(--surface);border-radius:8px;padding:.2rem .5rem;font-size:1.05rem;min-width:4.5rem;line-height:1.4}
.sp small{display:block;font-size:.72rem;color:var(--muted);font-family:"IBM Plex Sans Arabic",sans-serif}
.sp.okk{border-color:var(--ok);border-style:solid}
.sp.nok{border-color:var(--bad);border-style:solid}
.bl-eq{direction:ltr;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;justify-content:center;margin:.5rem 0}
.steps .eq{animation:fade .4s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lewis{direction:ltr;display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;margin:.5rem 0}
.mol{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem;text-align:center;font-size:1.4rem;min-width:9rem;transition:transform .8s}
.mol small{display:block;font-size:.78rem;color:var(--muted);direction:rtl}
.lp{color:var(--l4);font-weight:700;letter-spacing:-2px;margin-inline-end:2px}
.larrow{font-size:2rem;color:var(--l4);opacity:0;transition:opacity .6s}
.lewis.go .larrow{opacity:1}
.lewis.go .mol.n{transform:translateX(-12px)}
.parts{display:flex;flex-wrap:wrap;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem;min-height:120px;align-content:flex-start;direction:ltr}
.pt{border-radius:999px;padding:.1rem .55rem;font-size:.85rem;border:1px solid var(--line)}
.pt.h{background:var(--badbg);border-color:var(--bad)}
.pt.a{background:var(--aibg);border-color:var(--l4)}
.pt.m{background:var(--soft)}
.bulbrow{display:flex;gap:1.2rem;align-items:center;margin-top:.7rem}
.rank-pool,.rank-list{display:flex;flex-wrap:wrap;gap:.45rem;min-height:2.6rem}
.rank-list{border:1px dashed var(--line);border-radius:10px;padding:.5rem;margin:.5rem 0;background:var(--surface)}
.rk{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.3rem .7rem;font-size:.92rem;line-height:1.5;text-align:center}
.rk small{display:block;color:var(--muted);font-size:.78rem;direction:ltr}
.rk.okk{border-color:var(--ok);background:var(--okbg)}
.rk.nok{border-color:var(--bad);background:var(--badbg)}
.phview{display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:center}
.swatch{width:90px;height:90px;border-radius:12px;transition:background .4s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .9rem;font-size:.96rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;direction:ltr;text-align:right}
.calc{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.calc select,.calc input{font:inherit;padding:.4rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:auto}
.calc input{width:6.5rem;direction:ltr}
.tube-wrap{display:flex;gap:1.5rem;align-items:flex-end;flex-wrap:wrap}
.meter{font-family:"IBM Plex Sans Arabic",sans-serif;background:#1d2a33;color:#9ff0c0;border-radius:10px;padding:.6rem 1rem;font-size:1.6rem;direction:ltr;min-width:7.5rem;text-align:center}
.meter small{display:block;font-size:.7rem;color:#9fb6c4}
.tit{display:grid;grid-template-columns:150px 1fr;gap:1.2rem;align-items:start}
.tit svg.curve{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;height:auto}
.formgrid{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.formgrid select{font:inherit;padding:.4rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);direction:ltr}

/* lesson end */
.stats{width:100%;border-collapse:collapse;font-size:.95rem;margin:.8rem 0}
.stats th,.stats td{text-align:start;padding:.5rem .4rem;border-bottom:1px solid var(--line)}
.stats th{color:var(--muted);font-weight:500}
.tblwrap{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:0 .55rem;font-size:.82rem;font-weight:600}
.pill.g{background:var(--okbg);color:var(--ok)}
.pill.y{background:var(--badbg);color:var(--bad)}
.panel{border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;margin-top:1.3rem}
.panel h3{font-size:1.1rem;margin-bottom:.4rem}
.gq{border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem}

footer{border-top:1px solid var(--line);padding:1.4rem 1rem 2rem;text-align:center;font-size:.9rem;color:var(--muted)}
footer .credit{font-weight:600;color:var(--ink)}
footer .tools{display:flex;gap:.6rem;justify-content:center;margin-top:.7rem;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem}
.linkbtn.armed{background:var(--badbg);color:var(--bad);border-radius:6px;padding:.2rem .6rem;text-decoration:none;font-weight:600}

@media (max-width:860px){
  .lesson{grid-template-columns:1fr;gap:1rem}
  .side{position:static}
  .side ol{display:flex;overflow-x:auto;border-inline-start:0;border-bottom:2px solid var(--line);gap:.2rem}
  .side li{flex:none}
  .side li a,.side li span{border-inline-start:0;border-bottom:2px solid transparent;margin:0 0 -2px;white-space:nowrap}
  .side li.cur a{border-bottom-color:var(--acc)}
  .side li .ftitle{display:none}
  .side li.cur .ftitle{display:inline}
  .duo{grid-template-columns:1fr}
  .tit{grid-template-columns:1fr}
  .lrow{grid-template-columns:3rem 1fr;}
  .lrow .lact{grid-column:2}
  .top-count{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home">الأحماض والقواعد</a>
  <div class="mini-strip" id="miniStrip" aria-hidden="true"></div>
  <span class="top-count" id="topCount"></span>
</div></header>

<main class="wrap" id="app"></main>

<footer>
  <div class="credit">إعداد المعلمة: صباح داخل الأحمدي - الثانوية السادسة والثلاثون بالمدينة المنورة</div>
  <div>منصة تعليم مبرمج لفصل الأحماض والقواعد، كيمياء 2-2</div>
  <div class="tools">
    <button class="linkbtn" id="teacherBtn">فتح جميع الإطارات للمعاينة (للمعلمة)</button>
    <button class="linkbtn" id="resetBtn">مسح تقدّمي والبدء من جديد</button>
  </div>
</footer>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function chemHTML(s){
  return s.split(' ').map(tok => {
    if (tok === '->') return '→';
    if (tok === '<=>') return '⇌';
    if (tok === '+') return '+';
    let st = '', open = '', close = '';
    tok = tok.replace(/\((aq|l|s|g)\)$/, x => { st = x; return ''; });
    if (tok.startsWith('[')) { open = '['; tok = tok.slice(1); }
    if (tok.endsWith(']')) { close = ']'; tok = tok.slice(0, -1); }
    const m = tok.match(/^(\d*)([^\^]*)(?:\^(\d*[+-]))?$/);
    if (!m) return esc(tok);
    let body = m[2];
    if (/^[KMV][abw]$/.test(body)) body = body[0] + '<sub>' + body[1] + '</sub>';
    else body = body.replace(/([A-Za-z\)\]])(\d+)/g, '$1<sub>$2</sub>');
    return open + (m[1] || '') + body + (m[3] ? '<sup>' + m[3].replace('-', '−') + '</sup>' : '') + close + (st ? '<sub class="st">' + st + '</sub>' : '');
  }).join(' ');
}
const SUBU = s => s.replace(/(?<=[A-Za-z\)])\d+/g, d => [...d].map(x => '₀₁₂₃₄₅₆₇₈₉'[x]).join(''));
const c = s => `<bdi class="f">${chemHTML(s)}</bdi>`;
const eq = s => `<div class="eq" dir="ltr">${chemHTML(s)}</div>`;

  if (!isFinite(x) || x <= 0) return '—';

  m = Math.round(m * 100) / 100; if (m >= 10) { m = m / 10; e++; }
  return `${m.toFixed(m % 1 === 0 ? 1 : 2)} × 10<sup>${e}</sup>`;
}

{ id:'f7', lesson:1, title:'نظرية لويس', sim:'lewis',
  canva:'https://www.canva.com/design/DAGt56G_NgE/Np_knHPpa22UhHgGfSERpg/view?utm_content=DAGt56G_NgE&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h9c2b8e5b2e',
  body:`<p>اقترح لويس النموذج الأشمل، فربط السلوك الحمضي والقاعدي بأزواج الإلكترونات بدلًا من البروتونات:</p>
  <ul><li><b>حمض لويس:</b> أيون أو جزيء مستقبل لزوج من الإلكترونات.</li><li><b>قاعدة لويس:</b> أيون أو جزيء مانح لزوج من الإلكترونات.</li></ul>
  <p>في تفاعل ثلاثي فلوريد البورون مع الأمونيا، تمنح ذرة النيتروجين زوجها الحر لذرة البورون التي ينقصها زوج من الإلكترونات، فتتكوّن رابطة تساهمية تناسقية:</p>
  ${eq('BF3 + NH3 -> F3B–NH3')}
  <p>كل حمض في نظرية برونستد-لوري هو حمض لويس أيضًا، لكن العكس غير صحيح؛ فـ ${c('BF3')} حمض لويس رغم أنه لا يحتوي على هيدروجين.</p>`,
  qs:[
    { q:`في التفاعل ${c('BF3 + NH3 -> F3B–NH3')}، حمض لويس هو:`, o:[
      [c('BF3'),1,'صحيح. البورون يستقبل زوج الإلكترونات من النيتروجين.'],
      [c('NH3'),0,'النيتروجين يملك زوجًا حرًا ويمنحه، والمانح هو قاعدة لويس.'],
      [c('F3B–NH3'),0,'هذا ناتج التفاعل، وليس حمضًا ولا قاعدة فيه.'],
      ['لا يوجد حمض لعدم وجود هيدروجين يُمنح',0,'هذا تفكير برونستد-لوري. نظرية لويس تعتمد على أزواج الإلكترونات لا البروتونات.']]},
    { q:'قاعدة لويس هي مادة:', o:[
      ['مانحة لزوج من الإلكترونات',1,'أحسنتِ.'],
      ['مستقبلة لزوج من الإلكترونات',0,'هذا تعريف حمض لويس. القاعدة هي الطرف الذي يملك الزوج الحر ويمنحه.'],
      ['مانحة للبروتون',0,'هذا تعريف حمض برونستد-لوري.'],
      ['منتجة لأيونات الهيدروكسيد في الماء',0,'هذا تعريف قاعدة أرهينيوس.']]}
  ]},
/* ===== Lesson 2 ===== */
{ id:'f8', lesson:2, title:'قوة الأحماض', sim:'strength',
  canva:'https://sabaah.my.canva.site/dagt-rgkz64',
  body:`<p><b>الحمض القوي</b> يتأين كليًا في محلوله المائي، أي تتحول جزيئاته كلها تقريبًا إلى أيونات. من أمثلته: ${c('HCl')} و ${c('HBr')} و ${c('HI')} و ${c('HNO3')} و ${c('HClO4')} و ${c('H2SO4')} (في خطوته الأولى).</p>
  <p><b>الحمض الضعيف</b> يتأين جزئيًا، فتبقى معظم جزيئاته دون تأين. من أمثلته: ${c('CH3COOH')} و ${c('HF')} و ${c('H2CO3')} و ${c('HCN')}.</p>
  <p>عند التركيز نفسه، يحتوي محلول الحمض القوي على أيونات أكثر بكثير، لذلك يوصل التيار الكهربائي بدرجة أكبر ويضيء المصباح في جهاز اختبار التوصيل بشكل أشد.</p>
  <p class="note">لا تخلطي بين القوة والتركيز: القوة تعني نسبة التأين، والتركيز يعني كمية الحمض المذابة.</p>`,
  qs:[
    { q:'أيّ الأحماض الآتية حمض ضعيف؟', o:[
      [c('HF'),1,'صحيح. رغم أنه من الهالوجينات، فإن HF يتأين جزئيًا فقط.'],
      [c('HCl'),0,'HCl يتأين كليًا، فهو قوي.'],
      [c('HNO3'),0,'حمض النيتريك من الأحماض القوية الشائعة.'],
      [c('HI'),0,'HI حمض قوي، بل أقوى من HCl.']]},
    { q:'محلولان تركيز كل منهما 0.1 M. أيّهما يضيء المصباح بشدة أكبر؟', o:[
      [c('HCl'),1,'أحسنتِ. تأينه الكلي يعطي أيونات أكثر فيزداد التوصيل.'],
      [c('CH3COOH'),0,'حمض الإيثانويك ضعيف، تبقى معظم جزيئاته دون تأين، فتقل الأيونات.'],
      ['يضيئان بالشدة نفسها لتساوي التركيز',0,'تساوي التركيز لا يعني تساوي عدد الأيونات. نسبة التأين هي الفيصل.'],
      ['لا يضيء أيّ منهما',0,'كلاهما يحتوي على أيونات، لكن بكميات مختلفة.']]}
  ]},
{ id:'f9', lesson:2, title:'تأين الحمض وقاعدة برونستد المرافقة', sim:'equil',
  canva:'https://www.canva.com/design/DAGwiaDO41k/7F3-8yigX084z3x5KqWZ9A/view?utm_content=DAGwiaDO41k&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=ha8c6ffc780',
  body:`<p>يمكن تفسير قوة الحمض بنموذج برونستد-لوري. عند ذوبان الحمض ${c('HX')} في الماء:</p>
  ${eq('HX(aq) + H2O(l) <=> H3O^+(aq) + X^-(aq)')}
  <p>في الحمض القوي يزاح الاتزان كليًا تقريبًا نحو النواتج، لأن القاعدة المرافقة ${c('X^-')} ضعيفة جدًا ولا تميل إلى استعادة البروتون.</p>
  <p>في الحمض الضعيف يقع الاتزان جهة المتفاعلات، لأن القاعدة المرافقة أقوى نسبيًا وتستعيد البروتون بسهولة.</p>
  <p><b>القاعدة العامة:</b> كلما زادت قوة الحمض، ضعفت قاعدته المرافقة، والعكس صحيح.</p>`,
  qs:[
    { q:'كلما زادت قوة الحمض فإن قاعدته المرافقة:', o:[
      ['تكون أضعف',1,'صحيح. الحمض القوي يمنح بروتونه بسهولة لأن قاعدته المرافقة لا تجذبه بقوة.'],
      ['تكون أقوى',0,'لو كانت القاعدة المرافقة قوية لاستعادت البروتون، فيقل التأين ويضعف الحمض.'],
      ['لا تتأثر',0,'قوة الحمض وقوة قاعدته المرافقة مرتبطتان بعلاقة عكسية.'],
      ['تتحول إلى حمض قوي',0,'القاعدة المرافقة تبقى قاعدة؛ السؤال عن قوتها.']]},
    { q:`في محلول مائي من ${c('CH3COOH')}، معظم الجسيمات الموجودة هي:`, o:[
      [`جزيئات ${c('CH3COOH')} غير متأينة`,1,'أحسنتِ. الاتزان يقع جهة المتفاعلات في الحمض الضعيف.'],
      [`أيونات ${c('H3O^+')} و ${c('CH3COO^-')}`,0,'هذا يصف حمضًا قويًا. حمض الإيثانويك يتأين جزئيًا فقط.'],
      [`أيونات ${c('OH^-')}`,0,'المحلول حمضي، فأيونات OH- قليلة جدًا.'],
      [`جزيئات ${c('H2')}`,0,'لا يتكون غاز الهيدروجين عند ذوبان الحمض في الماء.']]}
  ]},
{ id:'f10', lesson:2, title:'ثابت تأين الحمض', sim:'rankKa',
  canva:'https://sabaah.my.canva.site/dagt-29-my',
  body:`<p>بما أن الحمض الضعيف يصل إلى حالة اتزان، يمكن كتابة ثابت الاتزان له، ويسمى <b>ثابت تأين الحمض</b> ${c('Ka')}:</p>
  ${eq('HA(aq) + H2O(l) <=> H3O^+(aq) + A^-(aq)')}
  <div class="eq" dir="ltr">K<sub>a</sub> = [H<sub>3</sub>O<sup>+</sup>][A<sup>−</sup>] / [HA]</div>
  <p>لا يظهر الماء في التعبير لأنه سائل نقي تركيزه ثابت.</p>
  <p>كلما كانت قيمة ${c('Ka')} أكبر، كان تأين الحمض أكبر وكان الحمض أقوى. مثال: ${c('Ka')} لـ ${c('HF')} يساوي ${'<bdi class="f">6.3 × 10<sup>−4</sup></bdi>'} وهو أقوى من ${c('CH3COOH')} الذي ${c('Ka')} له ${'<bdi class="f">1.8 × 10<sup>−5</sup></bdi>'}.</p>`,
  qs:[
    { q:'أيّ الأحماض الآتية هو الأقوى؟', o:[
      [`${c('HF')} (Ka = 6.3 × 10<sup>−4</sup>)`,1,'صحيح. أكبر قيمة Ka تعني أكبر تأين.'],
      [`${c('CH3COOH')} (Ka = 1.8 × 10<sup>−5</sup>)`,0,'قارني الأسس: 10 أس −5 أصغر من 10 أس −4.'],
      [`${c('H2CO3')} (Ka = 4.5 × 10<sup>−7</sup>)`,0,'هذه القيمة أصغر بكثير من 10 أس −4.'],
      [`${c('HCN')} (Ka = 6.2 × 10<sup>−10</sup>)`,0,'هذا أضعفها. تذكّري: كلما كبر الأس السالب صغرت القيمة.']]},
    { q:`تعبير ثابت التأين للحمض ${c('HCN')} هو:`, o:[
      ['<bdi class="f">[H<sub>3</sub>O<sup>+</sup>][CN<sup>−</sup>] / [HCN]</bdi>',1,'أحسنتِ. النواتج في البسط والحمض في المقام، دون الماء.'],
      ['<bdi class="f">[H<sub>3</sub>O<sup>+</sup>][CN<sup>−</sup>] / [HCN][H<sub>2</sub>O]</bdi>',0,'الماء سائل نقي تركيزه ثابت، فلا يُكتب في تعبير ثابت الاتزان.'],
      ['<bdi class="f">[HCN] / [H<sub>3</sub>O<sup>+</sup>][CN<sup>−</sup>]</bdi>',0,'هذا مقلوب التعبير. النواتج تكون في البسط.'],
      ['<bdi class="f">[H<sub>3</sub>O<sup>+</sup>] + [CN<sup>−</sup>]</bdi>',0,'ثابت الاتزان حاصل ضرب تراكيز النواتج مقسومًا على المتفاعلات، لا مجموعها.']]}
  ]},
{ id:'f11', lesson:2, title:'قوة القواعد', sim:'rankKb',
  canva:'https://sabaah.my.canva.site/dagt-yowodc',
  body:`<p><b>القاعدة القوية</b> تتفكك كليًا في الماء، مثل هيدروكسيدات فلزات المجموعتين الأولى والثانية: ${c('NaOH')} و ${c('KOH')} و ${c('Ca(OH)2')} و ${c('Ba(OH)2')}.</p>
  <p><b>القاعدة الضعيفة</b> تتأين جزئيًا، إذ تستقبل بروتونًا من الماء فتنتج أيونات ${c('OH^-')}:</p>
  ${eq('NH3(aq) + H2O(l) <=> NH4^+(aq) + OH^-(aq)')}
  <div class="eq" dir="ltr">K<sub>b</sub> = [NH<sub>4</sub><sup>+</sup>][OH<sup>−</sup>] / [NH<sub>3</sub>]</div>
  <p>يسمى ${c('Kb')} <b>ثابت تأين القاعدة</b>، وكلما زادت قيمته كانت القاعدة أقوى.</p>`,
  qs:[
    { q:'أيّ المواد الآتية قاعدة قوية؟', o:[
      [c('Ba(OH)2'),1,'صحيح. هيدروكسيد فلز من المجموعة الثانية يتفكك كليًا.'],
      [c('NH3'),0,'الأمونيا قاعدة ضعيفة تتأين جزئيًا.'],
      [c('CH3COOH'),0,'هذا حمض ضعيف، لا قاعدة.'],
      ['الأنيلين',0,'الأنيلين قاعدة ضعيفة جدًا، قيمة Kb له صغيرة.']]},
    { q:'أيّ القواعد الضعيفة الآتية هي الأضعف؟', o:[
      [`الأنيلين (Kb = 4.3 × 10<sup>−10</sup>)`,1,'أحسنتِ. أصغر قيمة Kb تعني أقل تأين.'],
      [`الأمونيا (Kb = 2.5 × 10<sup>−5</sup>)`,0,'قارني الأسس: −5 أكبر بكثير من −10.'],
      [`ميثيل أمين (Kb = 4.3 × 10<sup>−4</sup>)`,0,'هذه أكبر القيم تقريبًا، أي من الأقوى بين القواعد الضعيفة.'],
      [`إيثيل أمين (Kb = 5.0 × 10<sup>−4</sup>)`,0,'هذه أكبر قيمة، فهي الأقوى بين هذه القواعد.']]}
  ]},
/* ===== Lesson 3 ===== */
{ id:'f12', lesson:3, title:'أيونات الهيدروجين والرقم الهيدروجيني', sim:'phslider',
  canva:'https://sabaah.my.canva.site/daguaaqeuum',
  body:`<p>حاصل ضرب تركيزي أيونات الهيدروجين والهيدروكسيد في أيّ محلول مائي ثابت عند درجة حرارة معينة، ويسمى <b>ثابت تأين الماء</b>:</p>
  <div class="eq" dir="ltr">K<sub>w</sub> = [H<sup>+</sup>][OH<sup>−</sup>] = 1.0 × 10<sup>−14</sup> &nbsp;(298 K)</div>
  <p>لأن هذه التراكيز صغيرة جدًا، نستخدم <b>الرقم الهيدروجيني</b> ${c('pH')}:</p>
  <div class="eq" dir="ltr">pH = −log[H<sup>+</sup>]</div>
  <p>يتدرج مقياس pH من 0 إلى 14: أقل من 7 حمضي، و 7 متعادل، وأكبر من 7 قاعدي. وكل نقصان بمقدار وحدة واحدة في pH يعني زيادة ${c('[H^+]')} عشرة أضعاف.</p>`,
  qs:[
    { q:`محلول فيه ${'<bdi class="f">[H<sup>+</sup>] = 1.0 × 10<sup>−3</sup> M</bdi>'}. قيمة pH له:`, o:[
      ['3',1,'صحيح. pH = −log(10 أس −3) = 3.'],
      ['−3',0,'لا تنسي الإشارة السالبة في القانون: −log تجعل الناتج موجبًا.'],
      ['11',0,'11 هي قيمة pOH لهذا المحلول، لا pH.'],
      ['0.001',0,'هذا هو التركيز نفسه. المطلوب تطبيق −log عليه.']]},
    { q:`إذا كان ${'<bdi class="f">[H<sup>+</sup>] = 1.0 × 10<sup>−4</sup> M</bdi>'} فإن ${c('[OH^-]')} يساوي:`, o:[
      ['<bdi class="f">1.0 × 10<sup>−10</sup> M</bdi>',1,'أحسنتِ. ‎[OH−] = Kw ÷ [H+] = 10 أس −14 ÷ 10 أس −4.'],
      ['<bdi class="f">1.0 × 10<sup>−4</sup> M</bdi>',0,'التركيزان متساويان فقط في المحلول المتعادل. استخدمي Kw.'],
      ['<bdi class="f">1.0 × 10<sup>−18</sup> M</bdi>',0,'يبدو أنك ضربتِ بدلًا من القسمة. ‎[OH−] = Kw ÷ [H+].'],
      ['<bdi class="f">1.0 × 10<sup>10</sup> M</bdi>',0,'انتبهي لإشارة الأس عند القسمة: −14 − (−4) = −10.']]}
  ]},
{ id:'f13', lesson:3, title:'الرقم الهيدروجيني والرقم الهيدروكسيدي', sim:'calc',
  canva:'https://www.canva.com/design/DAGuAExmPDQ/nPkBjvkBWX4s7EJ6Tz0I6g/view?utm_content=DAGuAExmPDQ&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h255fa57ec2',
  body:`<p>بالطريقة نفسها نعرّف <b>الرقم الهيدروكسيدي</b> ${c('pOH')}:</p>
  <div class="eq" dir="ltr">pOH = −log[OH<sup>−</sup>]</div>
  <p>ومن ثابت تأين الماء نصل إلى علاقة مهمة جدًا:</p>
  <div class="eq" dir="ltr">pH + pOH = 14.00</div>
  <p>ولحساب التركيز من pH نستخدم العلاقة العكسية:</p>
  <div class="eq" dir="ltr">[H<sup>+</sup>] = 10<sup>−pH</sup> &nbsp;&nbsp; [OH<sup>−</sup>] = 10<sup>−pOH</sup></div>`,
  qs:[
    { q:'محلول قيمة pOH له تساوي 4. قيمة pH ونوع المحلول:', o:[
      ['pH = 10، قاعدي',1,'صحيح. pH = 14 − 4 = 10، وهي أكبر من 7.'],
      ['pH = 4، حمضي',0,'4 هي قيمة pOH. استخدمي العلاقة pH + pOH = 14.'],
      ['pH = 10، حمضي',0,'الحساب صحيح، لكن pH أكبر من 7 يعني محلولًا قاعديًا.'],
      ['pH = 18، قاعدي',0,'العلاقة طرح من 14 لا جمع: pH = 14 − pOH.']]},
    { q:'محلول قيمة pH له تساوي 2.0. تركيز أيونات الهيدروجين فيه:', o:[
      ['<bdi class="f">1.0 × 10<sup>−2</sup> M</bdi>',1,'أحسنتِ. ‎[H+] = 10 أس −pH.'],
      ['<bdi class="f">2.0 M</bdi>',0,'pH ليس هو التركيز، بل سالب لوغاريتمه.'],
      ['<bdi class="f">1.0 × 10<sup>−12</sup> M</bdi>',0,'هذا هو تركيز OH−، لأن pOH = 12.'],
      ['<bdi class="f">1.0 × 10<sup>2</sup> M</bdi>',0,'انتبهي للإشارة: الأس يكون −pH.']]}
  ]},
{ id:'f14', lesson:3, title:'قياس الرقم الهيدروجيني', sim:'measure',
  canva:'https://www.canva.com/design/DAGuAXP15-8/SREquSRBgnxIGh0XmQ6p_Q/view?utm_content=DAGuAXP15-8&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h43572e4318',
  body:`<p>يُقاس الرقم الهيدروجيني بطريقتين رئيستين:</p>
  <ul><li><b>الكواشف وورق pH:</b> مثل الكاشف العام الذي يتخذ لونًا مختلفًا عند كل قيمة pH، فنقارن اللون بمفتاح الألوان. طريقة سريعة لكنها تقريبية.</li>
  <li><b>جهاز قياس pH:</b> يحتوي على قطب يُغمس في المحلول، ويعطي قراءة رقمية دقيقة، لذلك يُفضَّل في المختبرات.</li></ul>
  <p>من أمثلة المواد اليومية: عصير الليمون حمضي (pH قريب من 2)، والدم قاعدي قليلًا (pH يقارب 7.4)، ومنظفات الأفران قاعدية قوية (pH يقارب 13).</p>`,
  qs:[
    { q:'أدق طريقة لقياس الرقم الهيدروجيني لمحلول هي:', o:[
      ['جهاز قياس pH',1,'صحيح. يعطي قراءة رقمية دقيقة بدلًا من مطابقة الألوان.'],
      ['ورقة تبّاع الشمس',0,'تبّاع الشمس يحدد هل المحلول حمضي أم قاعدي فقط، لا قيمة pH.'],
      ['الكاشف العام',0,'الكاشف العام يعطي قيمة تقريبية بمطابقة الألوان.'],
      ['التذوق',0,'التذوق خطير وممنوع في المختبر.']]},
    { q:'منظف أفران قيمة pH له تساوي 13. يوصف بأنه:', o:[
      ['قاعدي قوي',1,'أحسنتِ. القيمة قريبة من نهاية المقياس القاعدية.'],
      ['حمضي قوي',0,'القيم القريبة من 0 هي الحمضية القوية. 13 في الطرف الآخر.'],
      ['متعادل',0,'المتعادل قيمته 7.'],
      ['قاعدي ضعيف',0,'القاعدي الضعيف قريب من 7 مثل 8. أما 13 فبعيدة جدًا عن التعادل.']]}
  ]},

{ id:'f15', lesson:4, title:'التعادل', sim:'neutral',

/* Hosting outside Claude (Cloudflare Pages): talks to /api/ai served by _worker.js */
async function makeServerSample(){
  if (location.protocol === 'file:') return null;
  try {
    const r = await fetch('/api/ai', { method: 'GET', cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || !j.ok) return null;
  } catch (e) { return null; }
  const call = async (input, opts = {}) => {
    let r;
    try {
      r = await fetch('/api/ai', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ input, tier: opts.modelTier || 'default' }), signal: opts.signal });
    } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'network' }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || typeof j.text !== 'string') throw { code: j.code || 'upstream' };
    if (opts.onText) opts.onText({ text: j.text, delta: j.text });
    return { text: j.text, truncated: !!j.truncated };
  };
  call.json = async (input, opts = {}) => {
    const { text } = await call(input, opts);
    const clean = text.replace(/```json|```/g, '').trim();
    const a = clean.indexOf('{'), b = clean.lastIndexOf('}');
    if (a < 0 || b < a) throw { code: 'bad_shape' };
    try { return JSON.parse(clean.slice(a, b + 1)); } catch (err) { throw { code: 'bad_shape' }; }
  };
  return call;
}

function aiErr(e){
  const code = e && e.code;
  if (code === 'not_granted') return 'لم يُسمح باستخدام المعلمة الذكية في هذه الجلسة.';
  if (code === 'rate_limited') return 'طلبات كثيرة في وقت قصير، انتظري قليلًا ثم حاولي مرة أخرى.';
  if (code === 'cancelled') return '';
  return 'تعذّر الوصول إلى المعلمة الذكية الآن، حاولي بعد قليل.';
}
async function aiStream(input, outEl, opts = {}){
  if (!SAMPLE) return null;
  outEl.innerHTML = '<span class="who">المعلمة الذكية</span>تفكّر...';
  try {

/* ---------- unlock logic ---------- */
const frameUnlocked = i => S.unlockAll || i === 0 || !!S.done[FRAMES[i - 1].id];
const lessonDone = lid => framesOf(lid).every(f => S.done[f.id]);
const doneCount = () => FRAMES.filter(f => S.done[f.id]).length;

function renderTop(){
  const n = doneCount(), frac = n / FRAMES.length, lit = Math.round(frac * 15);
  $('#miniStrip').innerHTML = IND.map((col, i) => `<i style="background:${col};opacity:${i < lit ? 1 : .18}"></i>`).join('');
  $('#topCount').textContent = `${n} من ${FRAMES.length} إطارًا`;
}

/* ---------- router ---------- */
function route(){
  const h = location.hash.replace('#', '');
  let m;
  if ((m = h.match(/^l(\d)-f(\d+)$/))) { const fr = FRAMES.find(f => f.id === 'f' + m[2]); if (fr && frameUnlocked(fr.idx)) return renderFrame(fr); }
  if ((m = h.match(/^l(\d)-end$/))) { const lid = +m[1]; if (LESSONS[lid - 1] && (lessonDone(lid) || S.unlockAll)) return renderEnd(lid); }
  renderHome();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

function renderNext(fr, next){
  const slot = $('#nextSlot');
  if (!S.done[fr.id] && !S.unlockAll) { slot.innerHTML = `<span class="gate">أتقني أسئلة الإطار لينفتح الإطار التالي</span>`; return; }
  slot.innerHTML = next ? `<a class="btn" href="#l${fr.lesson}-${next.id}">الإطار التالي</a>` : `<a class="btn" href="#l${fr.lesson}-end">إنهاء الدرس وعرض الملخص</a>`;
}
function renderQs(fr){
  const box = $('#qlist');
  box.innerHTML = '';
  for (let k = 0; k < fr.qs.length; k++) {
    const key = fr.id + '-' + k, Q = fr.qs[k];
    if (S.correct[key]) {
      const right = Q.o.find(o => o[1]);
      box.insertAdjacentHTML('beforeend', `<div class="qdone"><b>✓</b> ${Q.q} <b>${right[0]}</b></div>`);
      continue;
    }
    if (!sessionOrder[key]) sessionOrder[key] = shuffle(Q.o.map((_, i) => i));
    const div = document.createElement('div');
    div.className = 'q';
    div.innerHTML = `<p class="qt">${k + 1}. ${Q.q}</p><div class="opts">${sessionOrder[key].map(i => `<button class="opt" data-i="${i}">${Q.o[i][0]}</button>`).join('')}</div><div class="fbz"></div>`;
    box.appendChild(div);
    div.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(fr, k, +b.dataset.i, b, div)));
    return; // show one unanswered question at a time
  }
  // all correct
  if (!S.done[fr.id]) { S.done[fr.id] = true; save(); renderTop(); }
  box.insertAdjacentHTML('beforeend', `<div class="fb good">أتقنتِ هذا الإطار. ${fr.idx === FRAMES.length - 1 ? 'وصلتِ إلى نهاية الفصل.' : 'يمكنك الانتقال إلى ما بعده.'}</div>`);
  const fs = framesOf(fr.lesson);
  renderNext(fr, fs[fs.indexOf(fr) + 1]);
  // refresh sidebar dot

function setupTutor(fr){
  const chatEl = $('#chat'), input = $('#askIn'), btn = $('#askBtn');
  if (!chatEl) return;
  const turns = chats[fr.id] || (chats[fr.id] = []);
  const draw = () => { chatEl.innerHTML = turns.map(t => `<div class="msg ${t.role === 'user' ? 'me' : 'bot'}">${t.role === 'user' ? esc(t.show || t.content) : fmtAI(t.content)}</div>`).join(''); chatEl.scrollTop = chatEl.scrollHeight; };
  draw();
  async function send(text){
    text = text.trim(); if (!text || !SAMPLE) return;
    const first = turns.length === 0;
    turns.push({ role: 'user', show: text, content: first ? `${PERSONA}\n\nالطالبة تدرس الآن الإطار «${fr.title}». مادته العلمية:\n${plain(fr.body)}\n\nأجيبي عن أسئلتها في حدود هذا الفصل. إن سألت عن موضوع خارج الكيمياء فأعيديها بلطف إلى الدرس.\n\nسؤال الطالبة: ${text}` : text });
    draw();
    const bubble = document.createElement('div'); bubble.className = 'msg bot'; bubble.textContent = 'تفكّر...'; chatEl.appendChild(bubble);
    btn.disabled = true;
    try {
      const { text: ans } = await SAMPLE(turns.map(t => ({ role: t.role, content: t.content })), { cache: false, modelTier: 'quick', onText: ({ text }) => { bubble.innerHTML = fmtAI(text); chatEl.scrollTop = chatEl.scrollHeight; } });
      turns.push({ role: 'assistant', content: ans });
    } catch (e) {
      turns.pop();
      bubble.textContent = aiErr(e);
    }
    btn.disabled = false;
    if (turns.length && turns[turns.length - 1].role === 'assistant') draw();
  }
  btn.addEventListener('click', () => { send(input.value); input.value = ''; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { send(input.value); input.value = ''; } });
  $$('#tutor .suggest .chip').forEach(b => b.addEventListener('click', () => send(b.dataset.s)));
}

  const pool = shuffle(items.map((_, i) => i));
  box.innerHTML = `<p class="hint">${hint}</p><div class="rank-pool" id="rp"></div><div class="rank-list" id="rl"><span class="gate">الأقوى أولًا</span></div>
    <div class="row"><button class="btn small" id="rchk">تحقّقي</button><button class="btn ghost small" id="rrs">إعادة</button></div><p class="out" id="ro2"></p>`;
  const lbl = it => `${plainNames ? it[0] : chemHTML(it[0])}<small>${k} = ${it[1]}</small>`;
  const draw = () => {
    $('#rp', box).innerHTML = pool.filter(i => !order.includes(i)).map(i => `<button class="rk" data-i="${i}">${lbl(items[i])}</button>`).join('');
    $('#rl', box).innerHTML = order.length ? order.map((i, n) => `<span class="rk" data-i="${i}">${n + 1}. ${lbl(items[i])}</span>`).join('') : '<span class="gate">الأقوى أولًا</span>';
    $$('#rp .rk', box).forEach(b => b.addEventListener('click', () => { order.push(+b.dataset.i); draw(); }));
  };
  $('#rchk', box).addEventListener('click', () => {
    if (order.length < items.length) { $('#ro2', box).textContent = 'رتّبي جميع العناصر أولًا.'; return; }
    const correct = items.map((_, i) => i).sort((a, b) => items[b][2] - items[a][2]);
    let ok = true;
    $$('#rl .rk', box).forEach((s, n) => { const good = order[n] === correct[n]; s.classList.add(good ? 'okk' : 'nok'); if (!good) ok = false; });
    $('#ro2', box).textContent = ok ? `ممتاز! كلما كبرت قيمة ${k} زادت القوة.` : `بعض المواضع غير صحيحة. قارني الأسس أولًا: الأس الأقل سالبية يعني قيمة أكبر.`;
  });
  $('#rrs', box).addEventListener('click', () => { order = []; $('#ro2', box).textContent = ''; draw(); });
  draw();
}

/* ---------- footer tools ---------- */
const syncTeacher = () => { $('#teacherBtn').textContent = S.unlockAll ? 'إعادة قفل الإطارات (التسلسل المبرمج)' : 'فتح جميع الإطارات للمعاينة (للمعلمة)'; };
$('#teacherBtn').addEventListener('click', () => { S.unlockAll = !S.unlockAll; save(); syncTeacher(); route(); });
/* two-step confirm: browser confirm() dialogs are blocked inside the viewer */
let resetArmed = false, resetTimer = null;
const RESET_LBL = 'مسح تقدّمي والبدء من جديد';
$('#resetBtn').addEventListener('click', () => {
  const b = $('#resetBtn');
  if (!resetArmed) {
    resetArmed = true;
    b.textContent = 'اضغطي مرة أخرى لتأكيد المسح';
    b.classList.add('armed');
    resetTimer = setTimeout(() => { resetArmed = false; b.textContent = RESET_LBL; b.classList.remove('armed'); }, 5000);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false; b.classList.remove('armed');
  const nm = S.name;
  S = { name: nm, done: {}, correct: {}, att: {}, first: {}, unlockAll: false };
  for (const k in sessionOrder) delete sessionOrder[k];
  for (const k in chats) delete chats[k];
  save(); syncTeacher();
  if (location.hash !== '#home') location.hash = '#home'; else route();
  window.scrollTo(0, 0);
  b.textContent = 'تم مسح التقدّم';
  setTimeout(() => { b.textContent = RESET_LBL; }, 2500);
});
/* ---------- auto-format formulas written as plain text (feedback, AI answers, sims) ---------- */
const FRX = /(?<![A-Za-z0-9])((?:[A-Z][a-z]?\d*|\((?:[A-Z][a-z]?\d*)+\)\d*)+)(\((?:aq|l|s|g)\))?(?:\^?([2-4]?[+\-−]))?(?![A-Za-z0-9])/g;
function fmtToken(body, st, ch){
  let h = /^[KMV][abw]$/.test(body) ? body[0] + '<sub>' + body[1] + '</sub>' : body.replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>');
  if (ch) h += '<sup>' + ch.replace('-', '−') + '</sup>';
  if (st) h += '<sub class="st">' + st + '</sub>';
  return h;
}
function chemifyText(node){
  const t = node.nodeValue;
  if (!/[A-Z]/.test(t)) return;
  let changed = false;
  const out = esc(t).replace(FRX, (all, body, st, ch) => { const h = fmtToken(body, st, ch); if (h === body) return all; changed = true; return '<bdi class="f">' + h + '</bdi>'; });
  if (!changed) return;
  const tmp = document.createElement('span'); tmp.innerHTML = out;
  node.replaceWith(...tmp.childNodes);
}
function chemify(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest('svg,script,style,textarea,input,select,option,sub,sup,.meter') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  list.forEach(chemifyText);
}
let chemQ = false;
new MutationObserver(() => { if (chemQ) return; chemQ = true; requestAnimationFrame(() => { chemQ = false; chemify($('#app')); }); }).observe($('#app'), { childList: true, subtree: true, characterData: true });

syncTeacher();
route();
</script>
